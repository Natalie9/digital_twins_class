<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D3.js - Grafo do Gêmeo Digital</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    svg { width: 100%; height: 680px; background: #fff; border-radius: 18px; box-shadow: 0 8px 24px rgba(15,23,42,.08); }
    .link { stroke: #94a3b8; stroke-opacity: .7; }
    .node text { font-size: 12px; paint-order: stroke; stroke: white; stroke-width: 4px; }
    .tooltip { position: fixed; padding: 10px 12px; background: #172033; color: white; border-radius: 10px; font-size: 13px; pointer-events: none; opacity: 0; }
  </style>
</head>
<body>
  <main class="container">
    <a href="../">← voltar</a>
    <h1>D3.js — Grafo de Entidades do Gêmeo Digital</h1>
    <p>Visualização customizada das relações entre sistema, salas, sensores, HVAC, modelo preditivo, alerta e operador.</p>
    <svg id="graph"></svg>
    <div id="tooltip" class="tooltip"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
