<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chart.js - Painel de Sensores</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .charts {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .chart-row {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.8fr);
      gap: 18px;
      align-items: stretch;
    }

    .chart-frame {
      position: relative;
      height: 360px;
    }

    .panel.wide .chart-frame {
      height: 430px;
    }

    .chart-frame.compact {
      height: 330px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    @media (max-width: 850px) {
      .chart-row {
        grid-template-columns: 1fr;
      }
      .panel.wide .chart-frame,
      .chart-frame,
      .chart-frame.compact {
        height: 340px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <a href="../">← voltar</a>
    <h1>Chart.js — Painel de Sensores</h1>
    <p>Gráficos prontos para acompanhar tendência, comparação e distribuição dos estados.</p>

    <section class="charts">
      <div class="panel wide">
        <h2>CO₂ ao longo do tempo</h2>
        <div class="chart-frame"><canvas id="co2Line"></canvas></div>
      </div>

      <div class="chart-row">
        <div class="panel">
          <h2>Energia por ambiente</h2>
          <div class="chart-frame"><canvas id="energyBar"></canvas></div>
        </div>
        <div class="panel">
          <h2>Estado dos ambientes</h2>
          <div class="chart-frame compact"><canvas id="statusDonut"></canvas></div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js?v=3"></script>
</body>
</html>
